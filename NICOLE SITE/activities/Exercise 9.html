<html>
<head>
<title>Sign Up Form</title>
<style>
body {
    font-family: "Times New Roman", serif;
    background-color: white;
}

.container {
    width: 760px;
    margin: 40px auto;
}

h2 {
    background-color: orange;
    color: gold;
    font-size: 32px;
    font-weight: normal;
    padding: 22px 15px;
    margin: 0;
}

form {
    background: black;
    padding: 20px 30px;
    color: gold;
    font-size: 24px;
    font-weight: bold;
}

.row {
    display: flex;
    align-items: center;
    margin-bottom: 28px;
}

label {
    width: 300px;
    text-align: right;
    padding-right: 20px;
    box-sizing: border-box;
    flex-shrink: 0;
}

input[type="text"],
input[type="email"],
input[type="tel"],
input[type="password"],
select {
    font-family: Arial, sans-serif;
    font-size: 20px;
    box-sizing: border-box;
}

.name-input {
    width: 185px;
}

.email-input,
.phone-input,
.password-input {
    width: 350px;
}

.date-select {
    display: flex;
    gap: 8px;
}

.date-select select:first-child {
    width: 90px;
}

.date-select select:nth-child(2) {
    width: 185px;
}

.date-select select:last-child {
    width: 95px;
}

.gender-options {
    font-size: 24px;
    white-space: nowrap;
}

.country-select {
    width: 165px;
}

.terms {
    text-align: right;
    margin-bottom: 15px;
    font-size: 22px;
}

.terms input {
    width: 18px;
    height: 18px;
}

.buttons {
    background-color: gold;
    padding: 10px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

button {
    font-family: Arial, sans-serif;
    font-size: 24px;
    color: white;
    padding: 3px 10px;
    cursor: pointer;
}

.submit {
    background-color: seagreen;
}

.cancel {
    background-color: firebrick;
}
</style>
</head>

<body>

<div class="container">

<h2>Sign Up</h2>

<form>

<div class="row">
<label>First Name</label>
<input class="name-input" type="text" placeholder="Enter First Name">
</div>

<div class="row">
<label>Last Name</label>
<input class="name-input" type="text" placeholder="Enter Last Name">
</div>

<div class="row">
<label>Date of Birth</label>
<div class="date-select">
<select>
<option value="">Date</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
<option>11</option>
<option>12</option>
<option>13</option>
<option>14</option>
<option>15</option>
<option>16</option>
<option>17</option>
<option>18</option>
<option>19</option>
<option>20</option>
<option>21</option>
<option>22</option>
<option>23</option>
<option>24</option>
<option>25</option>
<option>26</option>
<option>27</option>
<option>28</option>
<option>29</option>
<option>30</option>
<option>31</option>
</select>
<select>
<option value="">Month</option>
<option>January</option>
<option>February</option>
<option>March</option>
<option>April</option>
<option>May</option>
<option>June</option>
<option>July</option>
<option>August</option>
<option>September</option>
<option>October</option>
<option>November</option>
<option>December</option>
</select>
<select>
<option value="">Year</option>
<option>2000</option>
<option>2001</option>
<option>2002</option>
<option>2003</option>
<option>2004</option>
<option>2005</option>
<option>2006</option>
<option>2007</option>
<option>2008</option>
<option>2009</option>
<option>2010</option>
<option>2011</option>
<option>2012</option>
<option>2013</option>
<option>2014</option>
<option>2015</option>
</select>
</div>
</div>

<div class="row">
<label>Country</label>
<select class="country-select">
<option value="">Country</option>
<option>Philippines</option>
<option>Japan</option>
<option>South Korea</option>
<option>China</option>
<option>United States</option>
<option>Canada</option>
<option>Australia</option>
<option>United Kingdom</option>
<option>Singapore</option>
<option>Thailand</option>
</select>
</div>

<div class="row">
<label>Gender</label>
<div class="gender-options">
<input type="radio" name="gender" value="Male">Male
<input type="radio" name="gender" value="Female">Female
</div>
</div>

<div class="row">
<label>Country</label>
<select class="country-select">
<option value="">Country</option>
<option>Philippines</option>
<option>Japan</option>
<option>United States</option>
</select>
</div>

<div class="row">
<label>E-mail</label>
<input class="email-input" type="email" placeholder="Enter E-mail">
</div>

<div class="row">
<label>Phone</label>
<input class="phone-input" type="tel" placeholder="Enter Phone Number">
</div>

<div class="row">
<label>Password</label>
<input class="password-input" type="password">
</div>

<div class="row">
<label>Confirm Password</label>
<input class="password-input" type="password">
</div>

<div class="terms">
<input type="checkbox">
I agree to the Terms of Use
</div>

<div class="buttons">
<button class="submit" type="submit">Submit</button>
<button class="cancel" type="reset">Cancel</button>
</div>

</form>
</div>

</body>
</html>
